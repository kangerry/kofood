<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="komera_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>komera_mobile</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      try {
        var bu = localStorage.getItem('flutter.base_url') || localStorage.getItem('base_url');
        var isLocalHost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        // On production, default to same origin as this web app
        if (!isLocalHost && (!bu || !bu.trim())) {
          bu = window.location.origin;
        }
        // On local dev, default to local backend
        if (isLocalHost) {
          bu = 'http://localhost:8000';
        }
        try {
          localStorage.setItem('flutter.base_url', bu);
          localStorage.setItem('base_url', bu);
        } catch (_) {}
        var src = '/maps.js';
        if (bu && bu.trim()) {
          src = bu.replace(/\/+$/, '') + '/maps.js';
        }
        var loadScript = function(url, fallback) {
          var s = document.createElement('script');
          s.src = url;
          s.async = true; s.defer = true;
          if (fallback) {
            s.onerror = function() {
              try {
                document.head.removeChild(s);
              } catch(_) {}
              loadScript(fallback, null);
            };
          }
          document.head.appendChild(s);
        };
        // Try selected base_url first, fallback to explicit local backend if it fails
        loadScript(src, 'http://localhost:8000/maps.js');
      } catch (e) {
        var s = document.createElement('script');
        s.src = 'http://localhost:8000/maps.js';
        s.async = true; s.defer = true;
        document.head.appendChild(s);
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
